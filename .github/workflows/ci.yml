name: ProofBase
on:
  push:
    branches: [main, 'phase/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: proofbase-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.23.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Check encrypted threshold proof and circuit constraints
        env:
          PTAU: ${{ runner.temp }}/ppot_0080_16.ptau
          CIRCOM: ${{ runner.temp }}/circom
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/iden3/circom/releases/download/v2.2.3/circom-linux-amd64 -o "$CIRCOM"
          echo "85342c7ff332d948df7c0c50ecf201e6129349aef550ce873f3c811b79fe53a3  $CIRCOM" | sha256sum -c -
          chmod +x "$CIRCOM"
          curl -fsSL --retry 3 https://pse-trusted-setup-ppot.s3.eu-central-1.amazonaws.com/pot28_0080/ppot_0080_16.ptau -o "$PTAU"
          echo "ed3622a7c79b0b49aadd134ebbc5b77df8c8c59bccebdfd0d9bf2c1a51561cf9  $PTAU" | sha256sum -c -
          PATH="$RUNNER_TEMP:$PATH" pnpm test:circuit
          node tools/spike/prepare.mjs groth16 16
          node tools/spike/run.mjs 16
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.23.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Install pinned Compose
        shell: bash
        run: |
          set -euo pipefail
          version=v5.8.0
          mkdir -p "$RUNNER_TEMP/compose" "$HOME/.docker/cli-plugins"
          cd "$RUNNER_TEMP/compose"
          curl --fail --silent --show-error --location "https://github.com/docker/compose/releases/download/$version/docker-compose-linux-x86_64" -o docker-compose-linux-x86_64
          curl --fail --silent --show-error --location "https://github.com/docker/compose/releases/download/$version/docker-compose-linux-x86_64.sha256" -o checksum
          sha256sum --check checksum
          install -m 0755 docker-compose-linux-x86_64 "$HOME/.docker/cli-plugins/docker-compose"
          docker compose version
      - run: pnpm dev:init
      - run: docker compose config --quiet
      - run: pnpm infra:up
      - run: pnpm test:infra
      - name: Read both real testnets
        run: pnpm test:chains
      - name: Stop infrastructure
        if: always()
        run: docker compose down --remove-orphans
