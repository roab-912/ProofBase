name: Phase 0
on:
  push:
    branches: [main, 'phase/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase0-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.23.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.23.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Install pinned Compose
        shell: bash
        run: |
          set -euo pipefail
          version=v5.8.0
          mkdir -p "$RUNNER_TEMP/compose" "$HOME/.docker/cli-plugins"
          cd "$RUNNER_TEMP/compose"
          curl --fail --silent --show-error --location "https://github.com/docker/compose/releases/download/$version/docker-compose-linux-x86_64" -o docker-compose-linux-x86_64
          curl --fail --silent --show-error --location "https://github.com/docker/compose/releases/download/$version/docker-compose-linux-x86_64.sha256" -o checksum
          sha256sum --check checksum
          install -m 0755 docker-compose-linux-x86_64 "$HOME/.docker/cli-plugins/docker-compose"
          docker compose version
      - run: pnpm dev:init
      - run: docker compose config --quiet
      - run: pnpm infra:up
      - run: pnpm test:infra
      - name: Read both real testnets
        run: pnpm test:chains
      - name: Stop infrastructure
        if: always()
        run: docker compose down --remove-orphans
